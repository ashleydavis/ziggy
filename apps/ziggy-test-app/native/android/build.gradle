// The root build file. The SDK levels and the NDK version come from variables.gradle.

buildscript {
    repositories {
        google()
        // Google's mirror of Maven Central comes before Maven Central itself, which rate-limits busy networks: CI's runners were
        // refused every download with "429 Too Many Requests". Anything the mirror lacks still comes from Maven Central.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
    dependencies {
        // The same plugin version as Ziggy's Android native app, which is an included build of this one (it needs Gradle 8.7, see the
        // wrapper, and JDK 17). Gradle does not allow two versions of the Android plugin in one build.
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        // Google's mirror of Maven Central comes before Maven Central itself, which rate-limits busy networks: CI's runners were
        // refused every download with "429 Too Many Requests". Anything the mirror lacks still comes from Maven Central.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
