// The root build file. The SDK levels and the NDK version come from variables.gradle.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // The same plugin version as Ziggy's Android native app, which is an included build of this one (it needs Gradle 8.7, see the
        // wrapper, and JDK 17). Gradle does not allow two versions of the Android plugin in one build.
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
