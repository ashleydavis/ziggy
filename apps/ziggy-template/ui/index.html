<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ziggy template</title>
    <style>
        :root { color-scheme: light dark; }
        body { font-family: sans-serif; margin: 0 auto; padding: 16px; max-width: 900px; }
        h1 { margin-top: 0; }
        section { margin-bottom: 16px; }
        button { margin: 2px; padding: 6px 10px; }
        pre { border: 1px solid #8888; padding: 8px; min-height: 3em; white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <h1 data-id="heading">Ziggy template</h1>
    <section>
        <div data-id="greeting">Waiting for the backend...</div>
    </section>
    <section>
        <button data-id="start-task">Start the hello world task</button>
        <pre data-id="task-output"></pre>
    </section>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
