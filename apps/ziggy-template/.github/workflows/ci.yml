name: CI

# The checks every change gets, on Linux only: the TypeScript compile, the TypeScript unit tests, the app's Linux release build and
# the Zig unit tests, which start from that build. The builds for the other platforms, the smoke tests and the GitHub releases are
# in each platform's own release workflow.

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  typescript-compile:
    # Compiles the TypeScript, which is the only check of its types: the unit tests run it without checking them.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Compile TypeScript
        timeout-minutes: 12
        run: bun run compile

  typescript-unit-tests:
    # The TypeScript unit tests (the app's frontend).
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run the TypeScript unit tests
        timeout-minutes: 12
        shell: bash
        run: bun run test

  app-build-linux:
    # Builds the app's Linux release build with its build script into example-build/app. It saves the build and its Zig build
    # cache under the key example-build-linux-<commit>, which zig-unit-tests-linux restores.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install the web view's runtime libraries (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The newest earlier build of this platform is restored when there is none for this commit, so only what a change touches
      # is compiled again.
      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            example-build/app
          key: example-build-linux-${{ github.sha }}
          restore-keys: |
            example-build-linux-
          enableCrossOsArchive: true

      # Every save is the restored cache plus what the job built, so without this the cache only grows.
      - name: Start fresh Zig build caches when the restored ones have grown too big
        shell: bash
        run: |
          for cache_dir in .; do
              if [ -d "$cache_dir/.zig-cache" ]; then
                  megabytes="$(du -sm "$cache_dir/.zig-cache" | cut -f1)"
                  echo "Restored Zig build cache of $cache_dir: ${megabytes} MB"
                  if [ "$megabytes" -ge 5120 ]; then
                      mv "$cache_dir/.zig-cache" "$RUNNER_TEMP/stale-zig-cache-$(basename "$cache_dir")"
                      echo "Moved it aside to start a fresh one"
                  fi
              fi
          done

      # The restored output is an earlier build's, so it is moved aside first and only this build's output is saved.
      - name: Build
        shell: bash
        run: |
          if [ -d example-build/app ]; then
              mv example-build/app "$RUNNER_TEMP/stale-example-build-app"
          fi
          bun run build:linux --prefix "$PWD/example-build/app"

      # Saved only when the build passed, so no later job restores a build that stopped part way.
      - name: Save the build and the Zig build caches
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            example-build/app
          key: example-build-linux-${{ github.sha }}
          enableCrossOsArchive: true

  zig-unit-tests-linux:
    # The Zig unit tests of the app's backend (`zig build test`). They compile on top of the Zig build cache app-build-linux
    # saved.
    needs: app-build-linux
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux native app links GTK and WebKitGTK by their runtime library files, and its build stops with "error:
      # RuntimeLibraryMissing" when they are not installed.
      - name: Install the web view's runtime libraries (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # Zig skips any compile step whose inputs are unchanged and already in .zig-cache. This is the cache app-build saved for
      # Linux, so the tests compile only what that build did not. The path list is the one app-build saved, which the cache
      # needs to find the entry.
      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            example-build/app
          key: example-build-linux-${{ github.sha }}
          fail-on-cache-miss: true

      # The same tests `bun run test:zig` runs, which bundles the frontend first because the backend's tests embed it. They are
      # built for any x86-64 CPU: built for the runner's own, which differs from one runner to the next, every compile step
      # would miss the build cache restored above.
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: |
          bun run bundle:ui
          zig build test -Dcpu=baseline --summary all --test-timeout 20m
