            .zig-cache
            example-build/app
          key: example-build-ios-${{ github.sha }}
          restore-keys: |
            example-build-ios-
          enableCrossOsArchive: true

      # Every save is the restored cache plus what the job built, so without this the cache only grows.
      - name: Start fresh Zig build caches when the restored ones have grown too big
        shell: bash
        run: |
          for cache_dir in .; do
              if [ -d "$cache_dir/.zig-cache" ]; then
                  megabytes="$(du -sm "$cache_dir/.zig-cache" | cut -f1)"
                  echo "Restored Zig build cache of $cache_dir: ${megabytes} MB"
                  if [ "$megabytes" -ge 5120 ]; then
                      mv "$cache_dir/.zig-cache" "$RUNNER_TEMP/stale-zig-cache-$(basename "$cache_dir")"
                      echo "Moved it aside to start a fresh one"
                  fi
              fi
          done

      # The restored output is an earlier build's, so it is moved aside first and only this build's output is saved. The Windows
      # tools take a Windows path, which cygpath gives.
      - name: Build
        shell: bash
        run: |
          if [ -d example-build/app ]; then
              mv example-build/app "$RUNNER_TEMP/stale-example-build-app"
          fi
          case "ios" in
              linux)
                  bun run build:linux --prefix "$PWD/example-build/app"
                  ;;
              windows)
                  bun run build:windows --prefix "$(cygpath -m "$PWD")/example-build/app"
                  ;;
              macos-arm64)
                  bun run build:macos --configuration Release --arch arm64 --native-dir "$PWD/example-build/app/native" --build-dir "$PWD/example-build/app/xcode"
                  ;;
              macos-x64)
                  bun run build:macos --configuration Release --arch x86_64 --native-dir "$PWD/example-build/app/native" --build-dir "$PWD/example-build/app/xcode"
                  ;;
              android)
                  bun run build:android --arch "x86_64 arm64" --output-dir "$PWD/example-build/app"
                  ;;
              ios)
                  bun run build:ios --sdk simulator --configuration Release --native-dir "$PWD/example-build/app/native" --build-dir "$PWD/example-build/app/xcode"
                  ;;
              *)
                  echo "app-build has no build command for ios." >&2
                  exit 1
                  ;;
          esac

      # Saved only when the build passed, so no later job restores a build that stopped part way.
      - name: Save the build and the Zig build caches
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            example-build/app
          key: example-build-ios-${{ github.sha }}
          enableCrossOsArchive: true

  zig-unit-tests:
    # The Zig unit tests of the app's backend (`zig build test`), on the runner. They compile on top of the Zig build cache of
    # app-build's Linux entry.
    needs: app-build-linux
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux native app links GTK and WebKitGTK by their runtime library files, and its build stops with "error:
      # RuntimeLibraryMissing" when they are not installed.
      - name: Install the web view's runtime libraries (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # Zig skips any compile step whose inputs are unchanged and already in .zig-cache. This is the cache app-build saved for
      # Linux, so the tests compile only what that build did not. The path list is the one app-build saved, which the cache
      # needs to find the entry.
      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            example-build/app
          key: example-build-linux-${{ github.sha }}
          fail-on-cache-miss: true

      # The same tests `bun run test:zig` runs, which bundles the frontend first because the backend's tests embed it. They are
      # built for any x86-64 CPU: built for the runner's own, which differs from one runner to the next, every compile step
      # would miss the build cache restored above.
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: |
          bun run bundle:ui
          zig build test -Dcpu=baseline --summary all --test-timeout 20m
