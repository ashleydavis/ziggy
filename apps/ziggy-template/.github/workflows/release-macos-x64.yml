name: Release macOS x64

# Packages the Ziggy template for macOS x64 on an Intel runner and, when that passed on the default branch, publishes the
# packages as the GitHub release named "Ziggy template macOS x64", replacing the one before. It runs on every push. The app is
# never version tagged, but a GitHub release is always attached to a git tag, so the release sits on the tag
# `release-macos-x64`, which this workflow moves to the commit it built. A run that fails anywhere publishes nothing. The
# macOS smoke tests run on Apple Silicon only, in the macOS arm64 release workflow. The unit tests and the cross-build are in
# the CI workflow.

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  # Each platform has a workflow of its own, so a failure on one shows at a glance and holds up no other platform's release.
  # Its GitHub release sits on the tag release-<RELEASE_PLATFORM>.
  RELEASE_PLATFORM: "macos-x64"
  RELEASE_PLATFORM_NAME: "macOS x64"

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  package-release:
    # The app packaged for macOS x64 by its own package script, which builds for the runner's architecture, uploaded as an
    # artifact of the run.
    timeout-minutes: 60
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-template-zig-build-${{ github.sha }}-package-macos-x64
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ziggy-template-zig-build-

      - name: Package
        shell: bash
        run: bun run package:macos

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: ziggy-template-macos-x64
          path: out/macos/*
          if-no-files-found: error
          retention-days: 2

      # No smoke test job runs on this runner before this one, so this job saves the Zig build cache itself. Always, so a job
      # that fails part way still leaves what it compiled.
      - name: Save the Zig build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-template-zig-build-${{ github.sha }}-package-macos-x64

  create-release:
    # Publishes the packages, only when the packaging passed, and only for a push to the default branch, so a run on another
    # branch or a pull request packages the app and publishes nothing. This platform's release and its tag are deleted and made
    # again on the commit this run built.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [package-release]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: ziggy-template-macos-x64
          path: artifacts

      # Every platform's release tag moves to the commit its workflow built, so release-notes.sh would count from whichever of
      # them sorts first and report almost nothing. They are deleted from this checkout only, before the notes are made.
      - name: Generate release notes
        id: release-notes
        run: |
          git tag --list 'release-*' | xargs -r git tag -d > /dev/null
          RELEASE_NOTES=$(bash ./scripts/release-notes.sh)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Generated release notes:"
          echo "$RELEASE_NOTES"

      - name: Delete the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "release-${RELEASE_PLATFORM}" > /dev/null 2>&1; then
              gh release delete "release-${RELEASE_PLATFORM}" --yes --cleanup-tag
          fi

      - name: Publish the app
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ env.RELEASE_PLATFORM }}
          target_commitish: ${{ github.sha }}
          name: Ziggy template ${{ env.RELEASE_PLATFORM_NAME }}
          draft: false
          prerelease: true
          files: |
            ./artifacts/*.dmg
            ./artifacts/*.zip
          body: |
            The Ziggy template, packaged for ${{ env.RELEASE_PLATFORM_NAME }} from commit ${{ github.sha }}.

            ## Commits
            ${{ steps.release-notes.outputs.RELEASE_NOTES }}

            ## Downloads
            - **macOS (Intel)**: the `.dmg` disk image or the `.zip`
