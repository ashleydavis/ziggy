name: Release macOS x64

# Builds the Ziggy template for macOS x64 in app-build. Then, side by side on Intel runners, package makes the release
# packages, the unit tests run and the smoke tests drive the build app-build made. When all of them passed on the default
# branch, create-release publishes the packages as the GitHub release named "Ziggy template macOS x64", replacing the one
# before. It runs on every push. The app is never version tagged, but a GitHub release is always attached to a git tag, so the
# release sits on the tag `release-macos-x64`, which this workflow moves to the commit it built. A run that fails anywhere
# publishes nothing.

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  # Each platform has a workflow of its own, so a failure on one shows at a glance and holds up no other platform's release.
  # Its GitHub release sits on the tag release-<RELEASE_PLATFORM>.
  RELEASE_PLATFORM: "macos-x64"
  RELEASE_PLATFORM_NAME: "macOS x64"

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  app-build:
    # Builds the app's release build for macOS x64 with its build script into example-build/app, on an Intel runner. The smoke
    # tests drive this build. It saves the build and its Zig build cache under the key example-build-macos-x64-<commit>, which
    # the jobs that need app-build restore.
    timeout-minutes: 60
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The newest earlier build is restored when there is none for this commit, so only what a change touches is compiled
      # again.
      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            example-build/app
          key: example-build-macos-x64-${{ github.sha }}
          restore-keys: |
            example-build-macos-x64-

      # Every save is the restored cache plus what the job built, so without this the cache only grows.
      - name: Start fresh Zig build caches when the restored ones have grown too big
        shell: bash
        run: |
          for cache_dir in .; do
              if [ -d "$cache_dir/.zig-cache" ]; then
                  megabytes="$(du -sm "$cache_dir/.zig-cache" | cut -f1)"
                  echo "Restored Zig build cache of $cache_dir: ${megabytes} MB"
                  if [ "$megabytes" -ge 5120 ]; then
                      mv "$cache_dir/.zig-cache" "$RUNNER_TEMP/stale-zig-cache-$(basename "$cache_dir")"
                      echo "Moved it aside to start a fresh one"
                  fi
              fi
          done

      # The restored output is an earlier build's, so it is moved aside first and only this build's output is saved.
      - name: Build
        shell: bash
        run: |
          if [ -d example-build/app ]; then
              mv example-build/app "$RUNNER_TEMP/stale-example-build-app"
          fi
          bun run build:macos --configuration Release --arch x86_64 --native-dir "$PWD/example-build/app/native" --build-dir "$PWD/example-build/app/xcode"

      # Saved only when the build passed, so no later job restores a build that stopped part way.
      - name: Save the build and the Zig build caches
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            example-build/app
          key: example-build-macos-x64-${{ github.sha }}

  package:
    # Makes the app's release package for macOS x64 with its package script, on an Intel runner, starting from the Zig build
    # cache app-build saved so only what packaging adds is compiled. It runs beside the unit tests and the smoke tests and saves
    # the package under the key example-package-macos-x64-<commit>, which create-release restores.
    needs: app-build
    timeout-minutes: 60
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The path list is the one app-build saved, which the cache needs to find the entry.
      - name: Restore the Zig build caches from app-build
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            example-build/app
          key: example-build-macos-x64-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Package
        shell: bash
        run: bun run package:macos --arch x64 --output-dir "$PWD/out/macos-x64"

      - name: Save the package
        uses: actions/cache/save@v4
        with:
          path: out/macos-x64
          key: example-package-macos-x64-${{ github.sha }}

  unit-tests:
    # The TypeScript unit tests (the app's frontend) and the Zig unit tests of the app's backend (`zig build test`), on the
    # Intel macOS runner. The Zig tests compile on top of the Zig build cache app-build saved. It runs beside package and the
    # smoke tests.
    needs: app-build
    timeout-minutes: 50
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # Zig skips any compile step whose inputs are unchanged and already in .zig-cache. This is the cache app-build saved, so
      # the tests compile only what that build did not. The path list is the one app-build saved, which the cache needs to find
      # the entry.
      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            example-build/app
          key: example-build-macos-x64-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run the TypeScript unit tests
        timeout-minutes: 12
        shell: bash
        run: bun run test

      # The same tests `bun run test:zig` runs, which bundles the frontend first because the backend's tests embed it. They are
      # built for any CPU of the architecture: built for the runner's own, which differs from one runner to the next, every
      # compile step would miss the build cache restored above.
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: |
          bun run bundle:ui
          zig build test -Dcpu=baseline --summary all --test-timeout 20m

  app-smoke-tests:
    # The app's smoke tests on macOS on an Intel runner, in a real window on the runner's own display. They drive the build
    # app-build made.
    needs: app-build
    timeout-minutes: 75
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The path list is the one app-build saved, which the cache needs to find the entry.
      - name: Restore the build from app-build
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            example-build/app
          key: example-build-macos-x64-${{ github.sha }}
          fail-on-cache-miss: true

      # The smoke tests drive the build ZIGGY_SMOKE_BUILD names instead of building one.
      - name: Point the smoke tests at the build
        shell: bash
        run: echo "ZIGGY_SMOKE_BUILD=$PWD/example-build/app" >> "$GITHUB_ENV"

      # A step that hits its own timeout fails normally and keeps its log, so a hang shows up in the log.
      - name: Run the smoke tests
        timeout-minutes: 45
        shell: bash
        run: bun run test:smoke

  create-release:
    # Publishes the packages the package job made, only when every other job passed and only for a push to the default branch,
    # so a run on another branch or a pull request tests everything and publishes nothing. This platform's release and its tag
    # are deleted and made again on the commit this run built.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [app-build, package, unit-tests, app-smoke-tests]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The path list is the one the package job saved, which the cache needs to find the entry.
      - name: Restore the packages from package
        uses: actions/cache/restore@v4
        with:
          path: out/macos-x64
          key: example-package-macos-x64-${{ github.sha }}
          fail-on-cache-miss: true

      # Every platform's release tag moves to the commit its workflow built, so release-notes.sh would count from whichever of
      # them sorts first and report almost nothing. They are deleted from this checkout only, before the notes are made.
      - name: Generate release notes
        id: release-notes
        run: |
          git tag --list 'release-*' | xargs -r git tag -d > /dev/null
          RELEASE_NOTES=$(bash ./scripts/release-notes.sh)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Generated release notes:"
          echo "$RELEASE_NOTES"

      - name: Delete the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "release-${RELEASE_PLATFORM}" > /dev/null 2>&1; then
              gh release delete "release-${RELEASE_PLATFORM}" --yes --cleanup-tag
          fi

      - name: Publish the app
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ env.RELEASE_PLATFORM }}
          target_commitish: ${{ github.sha }}
          name: Ziggy template ${{ env.RELEASE_PLATFORM_NAME }}
          draft: false
          prerelease: true
          files: |
            ./out/macos-x64/*.dmg
            ./out/macos-x64/*.zip
          body: |
            The Ziggy template, packaged for ${{ env.RELEASE_PLATFORM_NAME }} from commit ${{ github.sha }}.

            ## Commits
            ${{ steps.release-notes.outputs.RELEASE_NOTES }}

            ## Downloads
            - **macOS (Intel)**: the `.dmg` disk image or the `.zip`
