<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ziggy template</title>
    <style>
        :root { color-scheme: light dark; }
        html { background: #ffffff; }
        @media (prefers-color-scheme: dark) { html { background: #000000; } }
        html[data-theme-setting="light"] { background: #ffffff; }
        html[data-theme-setting="dark"] { background: #000000; }
        html, body { height: 100%; }
        body { font-family: sans-serif; margin: 0; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
        h1 { margin: 0; }
        button { padding: 6px 10px; }
        pre { flex: 1; min-height: 0; overflow: auto; margin: 0; border: 1px solid #8888; padding: 8px; white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <h1 data-id="heading">Ziggy template</h1>
    <div>
        <button data-id="send-message">Send the hello world message</button>
        <button data-id="start-task">Start the hello world task</button>
        <button data-id="run-hello-action">Say hello from an action</button>
    </div>
    <div>
        <label>Theme:
            <select data-id="theme-select">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="system">System</option>
            </select>
        </label>
        <span data-id="theme-setting"></span>
    </div>
    <pre data-id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
