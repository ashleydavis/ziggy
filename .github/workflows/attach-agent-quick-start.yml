name: Attach agent quick start

# Attaches the release's own docs/agent-quick-start.md to every version release when it is published. The docs tell users to point
# their agent at https://github.com/ashleydavis/ziggy/releases/latest/download/agent-quick-start.md, which GitHub serves only from
# the files attached to the newest release, so a release without it leaves that address returning 404.

on:
  release:
    types:
      - published

jobs:
  attach:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release's tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Attach the agent quick start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" docs/agent-quick-start.md --clobber
