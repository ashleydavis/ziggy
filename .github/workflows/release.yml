          key: ziggy-build-linux-${{ github.sha }}
          fail-on-cache-miss: true

      # The smoke tests drive the build ZIGGY_SMOKE_BUILD names, the one app-build made, instead of building one. On Windows
      # cygpath gives a path both Git Bash and the Windows tools take.
      - name: Point the smoke tests at the build app-build made
        shell: bash
        run: |
          if [ "linux" = windows ]; then
              echo "ZIGGY_SMOKE_BUILD=$(cygpath -m "$PWD")/ziggy-build/app" >> "$GITHUB_ENV"
          else
              echo "ZIGGY_SMOKE_BUILD=$PWD/ziggy-build/app" >> "$GITHUB_ENV"
