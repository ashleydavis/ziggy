name: Release

# Builds and tests Ziggy and the Ziggy template on every platform when a version tag is pushed and, only when every one of those
# passed, publishes the GitHub release of the tag: release notes listing the commits since the version tag before it, and the
# tag's own docs/agent-quick-start.md and the template pinned to the tag (ziggy-template-<tag>.zip, made by
# scripts/package-template.sh) attached. The docs tell users to point their agent at
# https://github.com/ashleydavis/ziggy/releases/latest/download/agent-quick-start.md, which GitHub serves only from the files
# attached to the newest release, so a release without it leaves that address returning 404. The same build and test jobs run on
# every push and pull request in ci.yml (see docs/development/releasing-ziggy.md).

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

on:
  push:
    tags:
      - "v*"

  # Tests the branch it is started on and, when given a version tag that is already pushed, publishes that tag's release, for a tag
  # whose own run failed. A version tag is never moved, so the run takes this workflow and its actions from the branch and
  # everything it publishes from the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish the release of, such as v0.1.0. Leave it empty to test without publishing.
        required: false

jobs:
  zig-build:
    # Cross-builds the template's core for every platform, with and without the test hooks, and compiles the Windows native app. Zig
    # cross-builds from any machine, so this runs once, on Linux.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-

      # Every save is the restored cache plus what the job built, so without this the cache only grows.
      - name: Start fresh Zig build caches when the restored ones have grown too big
        shell: bash
        run: |
          for cache_dir in . apps/ziggy-template apps/ziggy-test-app; do
              if [ -d "$cache_dir/.zig-cache" ]; then
                  megabytes="$(du -sm "$cache_dir/.zig-cache" | cut -f1)"
                  echo "Restored Zig build cache of $cache_dir: ${megabytes} MB"
                  if [ "$megabytes" -ge 5120 ]; then
                      mv "$cache_dir/.zig-cache" "$RUNNER_TEMP/stale-zig-cache-$(basename "$cache_dir")"
                      echo "Moved it aside to start a fresh one"
                  fi
              fi
          done

      - name: Build and cross-build the Zig code
        shell: bash
        run: bun run compile:zig

      # Always, so a job that fails part way still leaves what it compiled.
      - name: Save the Zig build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}

  unit-tests:
    # The unit tests on each platform. The desktop platforms run the TypeScript tests (the bridge and the template's frontend) and every
    # Zig test (`zig build test`: Ziggy's core, the task queue, the native apps and the template's core) on the runner. Android runs the
    # Zig test programs on an emulator and the Android native app's JUnit tests on the runner's JVM. iOS runs the Zig test programs on a
    # simulator, because a program built for a phone cannot run on the runner.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux native app links GTK and WebKitGTK by their runtime library files, and its build stops with "error:
      # RuntimeLibraryMissing" when they are not installed.
      - name: Install the web view's runtime libraries (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-

      - name: Run the TypeScript unit tests
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        run: bun run test

      # `zig build test` builds the template's frontend itself before it runs the template's tests, which embed it.
      - name: Run the Zig unit tests
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        run: zig build test --summary all --test-timeout 20m

      # The Android scripts need JDK 17 and the NDK the template pins.
      - name: Setup JDK 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Android NDK
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      - name: Install Android NDK (Android)
        if: matrix.platform == 'android'
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      - name: Run the Android shell's JUnit tests (Android)
        if: matrix.platform == 'android'
        shell: bash
        run: bun run test:android-shell

      - name: Enable KVM (Android)
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The script is one line, because this action runs each line of `script:` in a shell of its own.
      - name: Run the Zig unit tests on an emulator (Android)
        if: matrix.platform == 'android'
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ZIGGY_ANDROID_DEVICES: emulator-5554
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bun run test:zig:android

      # The script runs the programs on a booted simulator and fails when none is, so one is booted here.
      - name: Boot an iOS simulator (iOS)
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Run the Zig unit tests on a simulator (iOS)
        if: matrix.platform == 'ios'
        run: bun run test:zig:ios

      # Always, so a job that fails part way still leaves what it compiled.
      - name: Save the Zig build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}-unit-${{ matrix.platform }}

  smoke-tests:
    # The template's smoke tests on every platform: Linux on a virtual display, Windows with the WebView2 SDK, MacOS on the runner's
    # own display, Android on an emulator and iOS on a simulator.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install the web view's runtime libraries and the display tools (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb x11-utils zip
          verify: xvfb-run xwininfo zip

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Fetch the WebView2 SDK and the WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: bun run --filter=ziggy-test-app setup

      - name: Setup JDK 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Android NDK
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      - name: Install Android NDK (Android)
        if: matrix.platform == 'android'
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      - name: Enable KVM (Android)
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-

      # A step that hits its own timeout fails normally and keeps its log, so a hang shows up in the log.
      # Each smoke step is capped at 20 minutes, a little above the slowest passing one (iOS, about 18): the dev mode step of the
      # Windows smoke job of CI run 40484807194 hung for over 30 minutes after it passed in 5 in the Release run of the same commit.
      - name: Run the smoke tests (desktop)
        if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
        timeout-minutes: 20
        shell: bash
        run: bun run test:smoke

      # The script is one line, because this action runs each line of `script:` in a shell of its own.
      - name: Run the smoke tests on an emulator (Android)
        if: matrix.platform == 'android'
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ZIGGY_ANDROID_DEVICES: emulator-5554
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bun run test:smoke:android

      # run.sh picks the first available iPhone simulator and boots it, and builds and installs the app with xcodebuild.
      - name: Run the smoke tests on a simulator (iOS)
        if: matrix.platform == 'ios'
        timeout-minutes: 20
        run: bun run test:smoke:ios

      # Saved under this platform's own key so a later run starts from the Zig part this one compiled. Always, so a job that fails
      # part way still leaves what it compiled.
      - name: Save the Zig build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}-smoke-${{ matrix.platform }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [zig-build, unit-tests, smoke-tests]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # zig fetch pins the template's build.zig.zon to the tag.
      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2.4.4
        with:
          install_args: zig

      - name: Install zip and unzip
        uses: ./.github/actions/install-apt-packages
        with:
          packages: zip unzip
          verify: zip unzip

      # Everything from here on comes from the tag, including when the run was started on a branch.
      - name: Check out the tag
        shell: bash
        run: git checkout --detach "refs/tags/$RELEASE_TAG"

      # The template, pinned to this tag, as ziggy-template-<tag>.zip, so a new app starts from a download instead of pinning Ziggy itself.
      - name: Package the template
        shell: bash
        run: bun run package:ziggy-template:archive "$RELEASE_TAG" "$RUNNER_TEMP/template"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./apps/ziggy-template/scripts/release-notes.sh --exclude-tag "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md docs/agent-quick-start.md "$RUNNER_TEMP/template/ziggy-template-$RELEASE_TAG.zip"
