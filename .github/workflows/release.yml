name: Release

# Builds and tests Ziggy and the Ziggy template on every platform, packages the template for every platform, and, when every one of
# those passed on the default branch, publishes the packaged template apps as the GitHub release named "Ziggy template", replacing
# the one before. It runs on every push and has nothing to do with Ziggy's version tags: a version of the package is released by
# pushing a version tag (see docs/development/releasing-ziggy.md). A GitHub release is always attached to a git tag, so the published template
# sits on the tag `template`, which this workflow moves to the commit it built and which is never a version tag. A run that fails
# anywhere publishes nothing.

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  zig-build:
    # Cross-builds the template's core for every platform, with and without the test hooks, and compiles the Windows native app. Zig
    # cross-builds from any machine, so this runs once, on Linux.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-

      # Every save is the restored cache plus what the job built, so without this the cache only grows.
      - name: Start fresh Zig build caches when the restored ones have grown too big
        shell: bash
        run: |
          for cache_dir in . apps/ziggy-template apps/ziggy-test-app; do
              if [ -d "$cache_dir/.zig-cache" ]; then
                  megabytes="$(du -sm "$cache_dir/.zig-cache" | cut -f1)"
                  echo "Restored Zig build cache of $cache_dir: ${megabytes} MB"
                  if [ "$megabytes" -ge 5120 ]; then
                      mv "$cache_dir/.zig-cache" "$RUNNER_TEMP/stale-zig-cache-$(basename "$cache_dir")"
                      echo "Moved it aside to start a fresh one"
                  fi
              fi
          done

      - name: Build and cross-build the Zig code
        shell: bash
        run: bun run compile:zig

      # Always, so a job that fails part way still leaves what it compiled.
      - name: Save the Zig build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}

  unit-tests:
    # The unit tests on each platform. The desktop platforms run the TypeScript tests (the bridge and the template's frontend) and every
    # Zig test (`zig build test`: Ziggy's core, the task queue, the native apps and the template's core) on the runner. Android runs the
    # Zig test programs on an emulator and the Android native app's JUnit tests on the runner's JVM. iOS runs the Zig test programs on a
    # simulator, because a program built for a phone cannot run on the runner.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux native app links GTK and WebKitGTK by their runtime library files, and its build stops with "error:
      # RuntimeLibraryMissing" when they are not installed.
      - name: Install the web view's runtime libraries (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-

      - name: Run the TypeScript unit tests
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        run: bun run test

      # `zig build test` builds the template's frontend itself before it runs the template's tests, which embed it.
      - name: Run the Zig unit tests
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        run: zig build test --summary all --test-timeout 20m

      # The Android scripts need JDK 17 and the NDK the template pins.
      - name: Setup JDK 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Android NDK
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      - name: Install Android NDK (Android)
        if: matrix.platform == 'android'
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      - name: Run the Android shell's JUnit tests (Android)
        if: matrix.platform == 'android'
        shell: bash
        run: bun run test:android-shell

      - name: Enable KVM (Android)
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The script is one line, because this action runs each line of `script:` in a shell of its own.
      - name: Run the Zig unit tests on an emulator (Android)
        if: matrix.platform == 'android'
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ZIGGY_ANDROID_DEVICES: emulator-5554
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bun run test:zig:android

      # The script runs the programs on a booted simulator and fails when none is, so one is booted here.
      - name: Boot an iOS simulator (iOS)
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Run the Zig unit tests on a simulator (iOS)
        if: matrix.platform == 'ios'
        run: bun run test:zig:ios

      # Always, so a job that fails part way still leaves what it compiled.
      - name: Save the Zig build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}-unit-${{ matrix.platform }}

  smoke-tests:
    # The template's smoke tests on every platform: Linux on a virtual display, Windows with the WebView2 SDK, MacOS on the runner's
    # own display, Android on an emulator and iOS on a simulator.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install the web view's runtime libraries and the display tools (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb x11-utils zip
          verify: xvfb-run xwininfo zip

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Fetch the WebView2 SDK and the WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: bun run --filter=ziggy-test-app setup

      - name: Setup JDK 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Android NDK
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      - name: Install Android NDK (Android)
        if: matrix.platform == 'android'
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      - name: Enable KVM (Android)
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-

      # A step that hits its own timeout fails normally and keeps its log, so a hang shows up in the log.
      - name: Run the smoke tests (desktop)
        if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
        timeout-minutes: 45
        shell: bash
        run: bun run test:smoke

      # Dev mode: the dev host and Vite with the frontend in the runner's Chrome, and the supervisor rebuilding the dev host.
      - name: Run the smoke tests in dev mode (desktop)
        if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
        timeout-minutes: 30
        shell: bash
        run: bun run test:smoke:dev

      # The script is one line, because this action runs each line of `script:` in a shell of its own.
      - name: Run the smoke tests on an emulator (Android)
        if: matrix.platform == 'android'
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ZIGGY_ANDROID_DEVICES: emulator-5554
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bun run test:smoke:android

      # run.sh picks the first available iPhone simulator and boots it, and builds and installs the app with xcodebuild.
      - name: Run the smoke tests on a simulator (iOS)
        if: matrix.platform == 'ios'
        timeout-minutes: 60
        run: bun run test:smoke:ios

      # Saved under this platform's own key so the package job, which builds the same release app, finds the Zig part already
      # built. Always, so a job that fails part way still leaves what it compiled.
      - name: Save the Zig build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}-smoke-${{ matrix.platform }}

  package:
    # Packages the template for every platform with its own package scripts, and uploads the packages as artifacts of the run. The
    # iOS archive is built without signing, and the Android APKs with the SDK and NDK. It runs after the smoke tests and starts
    # from the Zig build cache they saved, so the Zig part of the release build is not compiled a second time.
    needs: smoke-tests
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: ios
            os: macos-latest
          - platform: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install the packaging tools (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 zip
          verify: zip

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Fetch the WebView2 SDK and the WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: bun run --filter=ziggy-template setup

      - name: Cache the Android NDK
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      # Retried because the SDK manager downloads from Google and a download can arrive corrupt.
      - name: Set up the Android SDK and NDK (Android)
        if: matrix.platform == 'android'
        uses: ./.github/actions/retry-install
        with:
          run: bun run --filter=ziggy-template setup

      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-${{ github.sha }}-smoke-${{ matrix.platform }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ziggy-zig-build-

      - name: Package
        shell: bash
        run: bun run package:ziggy-template:${{ matrix.platform }}

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: ziggy-template-${{ matrix.platform }}
          path: apps/ziggy-template/out/${{ matrix.platform }}/*

  publish:
    # Publishes the packaged template apps, only when every build, test and package job passed, and only for a push to the default
    # branch, so a run on another branch or a pull request tests everything and publishes nothing. The release named "Ziggy template"
    # and its tag `template` are deleted and made again on the commit this run built.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [zig-build, unit-tests, smoke-tests, package]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: ziggy-template-*
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: release-notes
        run: |
          RELEASE_NOTES=$(bash ./apps/ziggy-template/scripts/release-notes.sh)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Generated release notes:"
          echo "$RELEASE_NOTES"

      - name: Delete the previous release of the template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view template > /dev/null 2>&1; then
              gh release delete template --yes --cleanup-tag
          fi

      - name: Publish the template
        uses: softprops/action-gh-release@v1
        with:
          tag_name: template
          target_commitish: ${{ github.sha }}
          name: Ziggy template
          draft: false
          prerelease: true
          files: |
            ./artifacts/*.zip
            ./artifacts/*.deb
            ./artifacts/*.msi
            ./artifacts/*.dmg
            ./artifacts/*.apk
            ./artifacts/*.ipa
          body: |
            The Ziggy template, built, tested and packaged for every platform from commit ${{ github.sha }}.

            ## What's changed since the last version of Ziggy
            ${{ steps.release-notes.outputs.RELEASE_NOTES }}

            ## Downloads
            - **Linux**: the `.deb` package or the `.zip`
            - **Windows**: the `.msi` installer or the `.zip`
            - **macOS**: the `.dmg` disk image or the `.zip`
            - **Android**: the `.apk` for your phone's architecture (debug signed, so it installs)
            - **iOS**: the unsigned `.ipa`, which has to be signed before it installs on a device
