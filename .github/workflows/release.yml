name: Release

# Builds and tests Ziggy's test app on every platform when a version tag is pushed and, only when every one of those
# passed, publishes the GitHub release of the tag: release notes listing the commits since the version tag before it, and the
# tag's own docs/agent-quick-start.md and the template pinned to the tag (ziggy-template-<tag>.zip, made by
# scripts/package-template.sh) attached. The docs tell users to point their agent at
# https://github.com/ashleydavis/ziggy/releases/latest/download/agent-quick-start.md, which GitHub serves only from the files
# attached to the newest release, so a release without it leaves that address returning 404. The same build and test jobs run on
# every push and pull request in ci.yml (see docs/development/releasing-ziggy.md): app-build builds the test app once on each
# platform's own runner. The unit tests and the smoke tests need it and use what it saved, so the smoke tests drive the app
# app-build built. The test app is never packaged or published.

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

on:
  push:
    tags:
      - "v*"

  # Tests the branch it is started on and, when given a version tag that is already pushed, publishes that tag's release, for a tag
  # whose own run failed. A version tag is never moved, so the run takes this workflow and its actions from the branch and
  # everything it publishes from the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish the release of, such as v0.1.0. Leave it empty to test without publishing.
        required: false

jobs:
  app-build-linux:
    # Builds the test app once per platform, on that platform's own runner, the one its smoke tests run on, into ziggy-build/app
    # (for iOS the simulator build). The build and the Zig build caches are saved under ziggy-build-<platform>-<commit>. The unit
    # tests and the smoke tests need this job, restore that entry and build no app of their own, so the smoke tests drive the app
    # app-build built.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux native app links GTK and WebKitGTK by their runtime library files, and its build stops with "error:
      # RuntimeLibraryMissing" when they are not installed.
      - name: Install the web view's runtime libraries (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ziggy-build-linux-${{ github.sha }}
          restore-keys: |
            ziggy-build-linux-

      # Every save is the restored cache plus what the job built, so without this the cache only grows.
      - name: Start fresh Zig build caches when the restored ones have grown too big
        shell: bash
        run: |
          for cache_dir in . apps/ziggy-template apps/ziggy-test-app; do
              if [ -d "$cache_dir/.zig-cache" ]; then
                  megabytes="$(du -sm "$cache_dir/.zig-cache" | cut -f1)"
                  echo "Restored Zig build cache of $cache_dir: ${megabytes} MB"
                  if [ "$megabytes" -ge 5120 ]; then
                      mv "$cache_dir/.zig-cache" "$RUNNER_TEMP/stale-zig-cache-$(basename "$cache_dir")"
                      echo "Moved it aside to start a fresh one"
                  fi
              fi
          done

      # The Windows tools take a Windows path, which cygpath gives.
      - name: Build the test app
        shell: bash
        working-directory: apps/ziggy-test-app
        run: |
          build="$GITHUB_WORKSPACE/ziggy-build/app"
          case "linux" in
              linux)
                  bun run build:linux --prefix "$build"
                  ;;
              windows)
                  bun run build:windows --prefix "$(cygpath -m "$GITHUB_WORKSPACE")/ziggy-build/app"
                  ;;
              macos)
                  bun run build:macos --configuration Release --native-dir "$build/native" --build-dir "$build/xcode"
                  ;;
              android)
                  bun run build:android --arch "x86_64 arm64" --output-dir "$build"
                  ;;
              ios)
                  bun run build:ios --sdk simulator --configuration Release --native-dir "$build/native" --build-dir "$build/xcode"
                  ;;
              *)
                  echo "app-build has no build command for linux." >&2
                  exit 1
                  ;;
          esac

      - name: Save the build
        uses: actions/cache/save@v4
        with:
          path: |
            ziggy-build
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ziggy-build-linux-${{ github.sha }}

  app-build-windows:
    # Builds the test app once per platform, on that platform's own runner, the one its smoke tests run on, into ziggy-build/app
    # (for iOS the simulator build). The build and the Zig build caches are saved under ziggy-build-<platform>-<commit>. The unit
    # tests and the smoke tests need this job, restore that entry and build no app of their own, so the smoke tests drive the app
    # app-build built.
