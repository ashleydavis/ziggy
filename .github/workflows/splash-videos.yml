name: Splash videos

# Builds the Ziggy template on every platform, starts it and records the screen from before it opens until after its splash
# screen has faded out, then uploads each video, kept for 3 days, to check the splash frame by frame. It is started by hand only.
# The recording is apps/ziggy-template/scripts/record-splash.sh (see record-splash.md).

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

on:
  push:

  workflow_dispatch:

jobs:
  splash-video-linux:
    timeout-minutes: 40
    # ubuntu-24.04, as in ci.yml: on ubuntu-26.04 every start of the Linux app waited 25 seconds for the desktop portal.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Install the web view's runtime libraries, the display and the recorder (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb ffmpeg
          verify: Xvfb ffmpeg

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Build the template
        shell: bash
        working-directory: apps/ziggy-template
        run: bun run build:linux --prefix "$GITHUB_WORKSPACE/splash-build"

      - name: Record the splash
        shell: bash
        working-directory: apps/ziggy-template
        run: bash scripts/record-splash.sh --platform linux --app "$GITHUB_WORKSPACE/splash-build/bin/ziggy-template" --seconds 25 --output "$GITHUB_WORKSPACE/splash-videos/ziggy-template-linux.mp4"

      - name: Upload the video
        uses: actions/upload-artifact@v4
        with:
          name: splash-video-linux
          path: splash-videos/ziggy-template-linux.mp4
          retention-days: 3
          if-no-files-found: error

  splash-video-windows:
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      # ffmpeg comes from a GitHub release, not Chocolatey, whose ffmpeg package stopped resolving from the Windows runners
      # (Photosphere's install-ffmpeg-windows action has the history). The `latest` release is used because the dated autobuild tags
      # are deleted upstream after about two weeks.
      - name: Install the recorder (Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=ffmpeg-n8.1-latest-win64-gpl-8.1.zip
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern "$asset" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/ffmpeg"
          dirname "$(find "$RUNNER_TEMP/ffmpeg" -name ffmpeg.exe -type f | head -1)" >> "$GITHUB_PATH"

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Fetch the WebView2 SDK and the WiX Toolset (Windows)
        shell: bash
        run: bun run --filter=ziggy-template setup

      # The Windows tools take a Windows path, which cygpath gives.
      - name: Build the template
        shell: bash
        working-directory: apps/ziggy-template
        run: bun run build:windows --prefix "$(cygpath -m "$GITHUB_WORKSPACE")/splash-build"

      - name: Record the splash
        shell: bash
        working-directory: apps/ziggy-template
        run: bash scripts/record-splash.sh --platform windows --app "$GITHUB_WORKSPACE/splash-build/ziggy-template/ziggy-template.exe" --seconds 60 --output "$GITHUB_WORKSPACE/splash-videos/ziggy-template-windows.mp4"

      - name: Upload the video
        uses: actions/upload-artifact@v4
        with:
          name: splash-video-windows
          path: splash-videos/ziggy-template-windows.mp4
          retention-days: 3
          if-no-files-found: error

  splash-video-macos:
    timeout-minutes: 40
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # record-splash.sh records macOS with ffmpeg: screencapture hung waiting on replayd, the system's screen recording service.
      - name: Install the recorder (macOS)
        uses: ./.github/actions/retry-install
        with:
          run: brew install ffmpeg
          verify: ffmpeg

      - name: Build the template
        shell: bash
        working-directory: apps/ziggy-template
        run: bun run build:macos --configuration Release --native-dir "$GITHUB_WORKSPACE/splash-build/native" --build-dir "$GITHUB_WORKSPACE/splash-build/xcode"

      - name: Record the splash
        shell: bash
        working-directory: apps/ziggy-template
        run: bash scripts/record-splash.sh --platform macos --app "$GITHUB_WORKSPACE/splash-build/xcode/Build/Products/Release/ZiggyTemplate.app" --seconds 25 --output "$GITHUB_WORKSPACE/splash-videos/ziggy-template-macos.mov"

      - name: Upload the video
        uses: actions/upload-artifact@v4
        with:
          name: splash-video-macos
          path: splash-videos/ziggy-template-macos.mov
          retention-days: 3
          if-no-files-found: error

  splash-video-ios:
    timeout-minutes: 40
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Build the template for the simulator
        shell: bash
        working-directory: apps/ziggy-template
        run: bun run build:ios --sdk simulator --configuration Release --native-dir "$GITHUB_WORKSPACE/splash-build/native" --build-dir "$GITHUB_WORKSPACE/splash-build/xcode"

      # A simulator boots in a minute or two, so the recording waits longer than on the desktop.
      - name: Record the splash
        shell: bash
        working-directory: apps/ziggy-template
        run: bash scripts/record-splash.sh --platform ios --app "$GITHUB_WORKSPACE/splash-build/xcode/Build/Products/Release-iphonesimulator/ZiggyTemplate.app" --seconds 40 --output "$GITHUB_WORKSPACE/splash-videos/ziggy-template-ios.mp4"

      # The whole recording, home screen included, which splash-video-ios-cut cuts to start on the splash.
      - name: Upload the recording
        uses: actions/upload-artifact@v4
        with:
          name: splash-recording-ios
          path: splash-videos/ziggy-template-ios.mp4
          retention-days: 3
          if-no-files-found: error

  # Cuts the iOS recording to start where the app's splash fills the screen, on Linux: macOS's ffmpeg crashed cutting it.
  splash-video-ios-cut:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: splash-video-ios
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the video tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: ffmpeg jq
          verify: ffmpeg jq

      - name: Download the recording
        uses: actions/download-artifact@v4
        with:
          name: splash-recording-ios
          path: splash-recording

      - name: Cut the recording to the splash
        shell: bash
        working-directory: apps/ziggy-template
        run: bash scripts/cut-to-splash.sh "$GITHUB_WORKSPACE/splash-recording/ziggy-template-ios.mp4" "$GITHUB_WORKSPACE/splash-videos/ziggy-template-ios.mp4" "iw/2:2:iw/4:ih/10"

      - name: Upload the video
        uses: actions/upload-artifact@v4
        with:
          name: splash-video-ios
          path: splash-videos/ziggy-template-ios.mp4
          retention-days: 3
          if-no-files-found: error

  splash-video-android:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Setup JDK 17 (Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      - name: Install Android NDK (Android)
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      # record-splash.sh cuts the recording to start where the app's splash fills the screen, with ffmpeg.
      - name: Install the video tools (Android)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: ffmpeg
          verify: ffmpeg

      - name: Enable KVM (Android)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the template
        shell: bash
        working-directory: apps/ziggy-template
        run: bun run build:android --arch x86_64 --output-dir "$GITHUB_WORKSPACE/splash-build"

      # The script is one line, because this action runs each line of `script:` in a shell of its own. The emulator is the
      # one smoke-tests-android in ci.yml uses.
      - name: Record the splash on an emulator (Android)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          script: cd apps/ziggy-template && bash scripts/record-splash.sh --platform android --app "$GITHUB_WORKSPACE/splash-build/ziggy-template.apk" --package dev.ziggy.template --seconds 30 --output "$GITHUB_WORKSPACE/splash-videos/ziggy-template-android.mp4"

      - name: Upload the video
        uses: actions/upload-artifact@v4
        with:
          name: splash-video-android
          path: splash-videos/ziggy-template-android.mp4
          retention-days: 3
          if-no-files-found: error
