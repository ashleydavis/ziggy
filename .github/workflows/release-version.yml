name: Release version

# Publishes the GitHub release of a version tag when the tag is pushed: release notes listing the commits since the version tag
# before it, and the tag's own docs/agent-quick-start.md and the template pinned to the tag (ziggy-template-<tag>.zip, made by
# scripts/package-template.sh) attached. The docs tell users to point their agent at
# https://github.com/ashleydavis/ziggy/releases/latest/download/agent-quick-start.md, which GitHub serves only from the files
# attached to the newest release, so a release without it leaves that address returning 404.

on:
  push:
    tags:
      - "v*"

  # Publishes the release of a tag that is already pushed, for a tag whose own run failed. A version tag is never moved, so the run
  # takes this workflow and its actions from the branch it is started on and everything it publishes from the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish the release of, such as v0.1.0.
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      # zig fetch pins the template's build.zig.zon to the tag.
      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2.4.4
        with:
          install_args: zig

      - name: Install zip and unzip
        uses: ./.github/actions/install-apt-packages
        with:
          packages: zip unzip
          verify: zip unzip

      # Everything from here on comes from the tag, including when the run was started on a branch.
      - name: Check out the tag
        shell: bash
        run: git checkout --detach "refs/tags/$RELEASE_TAG"

      # The template, pinned to this tag, as ziggy-template-<tag>.zip, so a new app starts from a download instead of pinning Ziggy itself.
      - name: Package the template
        shell: bash
        run: bun run package:ziggy-template:archive "$RELEASE_TAG" "$RUNNER_TEMP/template"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ./apps/ziggy-template/scripts/release-notes.sh --exclude-tag "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md docs/agent-quick-start.md "$RUNNER_TEMP/template/ziggy-template-$RELEASE_TAG.zip"
