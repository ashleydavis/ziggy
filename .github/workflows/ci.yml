name: CI

# Builds Ziggy's test app and runs every unit test and smoke test on every platform, on every push to every branch and every pull
# request to `main`. The app-build job runs first: on each platform's own runner it builds the test app once and saves it. The
# unit tests and the smoke tests need app-build and restore what it saved, so the smoke tests drive the app app-build built. It runs
# the same jobs as the release workflow (release.yml) but does not publish: the release workflow does that when a version tag is
# pushed.

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  app-build:
    # Builds the test app once per platform, on that platform's own runner, the one its smoke tests run on, into ziggy-build/app
    # (for iOS the simulator build). The build and the Zig build caches are saved under ziggy-build-<platform>-<commit>. The unit
    # tests and the smoke tests need this job, restore that entry and build no app of their own, so the smoke tests drive the app
    # app-build built.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux native app links GTK and WebKitGTK by their runtime library files, and its build stops with "error:
      # RuntimeLibraryMissing" when they are not installed.
      - name: Install the web view's runtime libraries (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Fetch the WebView2 SDK and the WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: bun run --filter=ziggy-test-app setup

      # The Android scripts need JDK 17 and the NDK the template pins.
      - name: Setup JDK 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Android NDK
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      - name: Install Android NDK (Android)
        if: matrix.platform == 'android'
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      - name: Restore the Zig build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ziggy-build-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ziggy-build-${{ matrix.platform }}-

      # Every save is the restored cache plus what the job built, so without this the cache only grows.
      - name: Start fresh Zig build caches when the restored ones have grown too big
        shell: bash
        run: |
          for cache_dir in . apps/ziggy-template apps/ziggy-test-app; do
              if [ -d "$cache_dir/.zig-cache" ]; then
                  megabytes="$(du -sm "$cache_dir/.zig-cache" | cut -f1)"
                  echo "Restored Zig build cache of $cache_dir: ${megabytes} MB"
                  if [ "$megabytes" -ge 5120 ]; then
                      mv "$cache_dir/.zig-cache" "$RUNNER_TEMP/stale-zig-cache-$(basename "$cache_dir")"
                      echo "Moved it aside to start a fresh one"
                  fi
              fi
          done

      # The Windows tools take a Windows path, which cygpath gives.
      - name: Build the test app
        shell: bash
        working-directory: apps/ziggy-test-app
        run: |
          build="$GITHUB_WORKSPACE/ziggy-build/app"
          case "${{ matrix.platform }}" in
              linux)
                  bun run build:linux --prefix "$build"
                  ;;
              windows)
                  bun run build:windows --prefix "$(cygpath -m "$GITHUB_WORKSPACE")/ziggy-build/app"
                  ;;
              macos)
                  bun run build:macos --configuration Release --native-dir "$build/native" --build-dir "$build/xcode"
                  ;;
              android)
                  bun run build:android --arch "x86_64 arm64" --output-dir "$build"
                  ;;
              ios)
                  bun run build:ios --sdk simulator --configuration Release --native-dir "$build/native" --build-dir "$build/xcode"
                  ;;
              *)
                  echo "app-build has no build command for ${{ matrix.platform }}." >&2
                  exit 1
                  ;;
          esac

      - name: Save the build
        uses: actions/cache/save@v4
        with:
          path: |
            ziggy-build
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ziggy-build-${{ matrix.platform }}-${{ github.sha }}

  unit-tests:
    # The unit tests on each platform. The desktop platforms run the TypeScript tests (the bridge and the template's frontend) and every
    # Zig test (`zig build test`: Ziggy's core, the task queue, the native apps and the template's core) on the runner. Android runs the
    # Zig test programs on an emulator and the Android native app's JUnit tests on the runner's JVM. iOS runs the Zig test programs on a
    # simulator, because a program built for a phone cannot run on the runner. It starts from the Zig build caches app-build saved and
    # compiles only the tests.
    needs: app-build
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux native app links GTK and WebKitGTK by their runtime library files, and its build stops with "error:
      # RuntimeLibraryMissing" when they are not installed.
      - name: Install the web view's runtime libraries (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: |
            ziggy-build
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ziggy-build-${{ matrix.platform }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run the TypeScript unit tests
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        run: bun run test

      # `zig build test` builds the template's frontend itself before it runs the template's tests, which embed it.
      - name: Run the Zig unit tests
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        run: zig build test --summary all --test-timeout 20m

      # The Android scripts need JDK 17 and the NDK the template pins.
      - name: Setup JDK 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Android NDK
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      - name: Install Android NDK (Android)
        if: matrix.platform == 'android'
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      - name: Run the Android shell's JUnit tests (Android)
        if: matrix.platform == 'android'
        shell: bash
        run: bun run test:android-shell

      - name: Enable KVM (Android)
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The script is one line, because this action runs each line of `script:` in a shell of its own.
      - name: Run the Zig unit tests on an emulator (Android)
        if: matrix.platform == 'android'
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ZIGGY_ANDROID_DEVICES: emulator-5554
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bun run test:zig:android

      # The script runs the programs on a booted simulator and fails when none is, so one is booted here.
      - name: Boot an iOS simulator (iOS)
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Run the Zig unit tests on a simulator (iOS)
        if: matrix.platform == 'ios'
        run: bun run test:zig:ios

  smoke-tests:
    # The test app's smoke tests on every platform, driving the build app-build made through the remote control server: Linux on a
    # virtual display, Windows, MacOS on the runner's own display, Android on an emulator and iOS on a simulator.
    needs: app-build
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install the web view's runtime libraries and the display tools (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb x11-utils
          verify: xvfb-run xwininfo

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Setup JDK 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the Android NDK
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      - name: Install Android NDK (Android)
        if: matrix.platform == 'android'
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      - name: Enable KVM (Android)
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: |
            ziggy-build
            .zig-cache
            apps/ziggy-template/.zig-cache
            apps/ziggy-test-app/.zig-cache
          key: ziggy-build-${{ matrix.platform }}-${{ github.sha }}
          fail-on-cache-miss: true

      # The smoke tests drive the build ZIGGY_SMOKE_BUILD names, the one app-build made, instead of building one. On Windows
      # cygpath gives a path both Git Bash and the Windows tools take.
      - name: Point the smoke tests at the build app-build made
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = windows ]; then
              echo "ZIGGY_SMOKE_BUILD=$(cygpath -m "$PWD")/ziggy-build/app" >> "$GITHUB_ENV"
          else
              echo "ZIGGY_SMOKE_BUILD=$PWD/ziggy-build/app" >> "$GITHUB_ENV"
          fi

      # A step that hits its own timeout fails normally and keeps its log, so a hang shows up in the log.
      # Each smoke step is capped at 20 minutes, a little above the slowest passing one (iOS, about 18): the dev mode step of the
      # Windows smoke job of CI run 40484807194 hung for over 30 minutes after it passed in 5 in the Release run of the same commit.
      - name: Run the smoke tests (desktop)
        if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
        timeout-minutes: 20
        shell: bash
        run: bun run test:smoke

      # The script is one line, because this action runs each line of `script:` in a shell of its own.
      - name: Run the smoke tests on an emulator (Android)
        if: matrix.platform == 'android'
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ZIGGY_ANDROID_DEVICES: emulator-5554
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bun run test:smoke:android

      # run.sh picks the first available iPhone simulator and boots it, and installs the simulator build app-build made.
      - name: Run the smoke tests on a simulator (iOS)
        if: matrix.platform == 'ios'
        timeout-minutes: 20
        run: bun run test:smoke:ios
